name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the DMG to Releases

jobs:
  macos-arm64:
    runs-on: macos-15   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && uname -m && sw_vers
      - name: Unit tests
        run: swift test
      - name: Build app + DMG
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AceStreamPlayer-arm64
          path: build/AceStreamPlayer.dmg
      - name: Screenshots (EN/RU, dark/light)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          "build/AceStream Player.app/Contents/MacOS/AceStreamPlayer" --render-screenshots "$PWD/build/screenshots"
          ls -la build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/AceStreamPlayer.dmg \
            --title "AceStream Player $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
